<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lashista By Rouba | متجر العدسات الطبية والملونة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Great+Vibes&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #5e234d;
            --primary-dark: #3d1431;
            --primary-light: #8a3c73;
            --rose-gold: #c98ca7;
            --gold-accent: #d4af37;
            --rose-gold-Border: #dfb5c7;
            --light-pink: #fcf5f8;
            --soft-blush: #f7e8ef;
            --card-bg: #ffffff;
            --text-main: #2a1824;
            --text-muted: #786271;
            --border-color: #eedae4;
            --whatsapp-green: #25D366;
            --danger: #d32f2f;
            --heart-red: #e91e63;
            --success: #2e7d32;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--light-pink);
            background-image: radial-gradient(circle at 15% 20%, rgba(201, 140, 167, 0.08) 0%, transparent 40%),
                              radial-gradient(circle at 85% 80%, rgba(94, 35, 77, 0.06) 0%, transparent 40%);
            color: var(--text-main);
            padding-bottom: 100px;
            overflow-x: hidden;
        }

        .top-ticker {
            background: linear-gradient(90deg, var(--primary-dark), var(--primary), var(--primary-dark));
            color: #fff;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 7px 15px;
            text-align: center;
            letter-spacing: 0.3px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.4);
        }

        .top-ticker span { color: #f8d7e6; }

        header {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--rose-gold-Border);
            padding: 10px 16px;
            position: sticky;
            top: 0;
            z-index: 500;
            box-shadow: 0 6px 20px rgba(94, 35, 77, 0.08);
        }

        .header-inner {
            max-width: 1150px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
        }

        .header-side-right { display: flex; align-items: center; justify-content: flex-start; gap: 8px; }
        .header-side-left { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }

        .brand-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0 8px;
            cursor: pointer;
            user-select: none;
        }

        .logo-emblem {
            display: flex;
            align-items: baseline;
            justify-content: center;
            direction: ltr;
            position: relative;
            line-height: 1;
        }

        .ornate-l {
            font-family: 'Great Vibes', cursive;
            font-size: 2.7rem;
            color: var(--primary);
            background: linear-gradient(135deg, var(--primary) 20%, #b86b8e 60%, var(--gold-accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 400;
            margin-right: -3px;
            filter: drop-shadow(0 2px 4px rgba(94, 35, 77, 0.18));
            display: inline-block;
            transform: translateY(3px);
        }

        .brand-rest {
            font-family: 'Cinzel Decorative', serif;
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 1.5px;
        }

        .brand-sub {
            font-size: 0.72rem;
            font-weight: 800;
            color: var(--rose-gold);
            letter-spacing: 1px;
            margin-top: -2px;
        }

        .btn-wishlist-header {
            background: #fff;
            color: var(--primary);
            border: 1.5px solid var(--rose-gold-Border);
            padding: 8px 12px;
            border-radius: 25px;
            font-weight: 800;
            font-size: 0.82rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s ease;
        }

        .btn-wishlist-header:hover { background: #fff0f5; border-color: var(--heart-red); }
        .wishlist-count { background: #fce4ec; color: var(--heart-red); padding: 1px 6px; border-radius: 50%; font-size: 0.75rem; font-weight: 900; }

        .btn-cart {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 25px;
            font-weight: 800;
            font-size: 0.84rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 12px rgba(94, 35, 77, 0.25);
            transition: transform 0.2s ease;
        }

        .btn-cart:active { transform: scale(0.96); }
        .cart-count { background: var(--rose-gold); color: #fff; padding: 2px 7px; border-radius: 50%; font-size: 0.76rem; min-width: 21px; text-align: center; }

        .trust-banner { max-width: 1120px; margin: 14px auto 8px; padding: 0 15px; }
        .trust-banner-inner {
            background: linear-gradient(to left, #ffffff, #fdf2f7);
            border: 1px solid var(--border-color);
            border-right: 4px solid var(--primary);
            border-radius: 14px;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 0.82rem;
            color: var(--text-main);
            box-shadow: 0 3px 10px rgba(94, 35, 77, 0.04);
        }

        .categories-bar { max-width: 1120px; margin: 12px auto; padding: 4px 15px; display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; }
        .categories-bar::-webkit-scrollbar { display: none; }

        .cat-btn {
            background: #fff;
            color: var(--text-main);
            border: 1.5px solid var(--border-color);
            padding: 10px 18px;
            border-radius: 25px;
            font-weight: 800;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.25s ease;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        .cat-btn.active {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: #fff;
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(94, 35, 77, 0.22);
        }

        .products-grid {
            max-width: 1120px;
            margin: 15px auto 30px;
            padding: 0 15px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 22px;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: 20px;
            border: 1.5px solid var(--border-color);
            overflow: hidden;
            box-shadow: 0 8px 22px rgba(94, 35, 77, 0.06);
            display: flex;
            flex-direction: column;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .product-card:hover { transform: translateY(-4px); box-shadow: 0 12px 28px rgba(94, 35, 77, 0.12); }
        .product-card.out-of-stock-card { opacity: 0.75; }

        .card-header {
            padding: 13px 16px;
            background: linear-gradient(to left, #fcf5f8, #ffffff);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .lens-title { font-size: 1rem; font-weight: 800; color: var(--primary); }
        .lens-badge { font-size: 0.72rem; padding: 4px 10px; border-radius: 12px; background: var(--soft-blush); color: var(--primary); font-weight: 800; white-space: nowrap; }

        .eye-image-box {
            width: 100%;
            height: 215px;
            background: #f3eef1;
            position: relative;
            cursor: zoom-in;
            overflow: hidden;
            user-select: none;
        }

        .eye-image-box img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.35s ease; }
        .eye-image-box:hover img { transform: scale(1.05); }

        .slider-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            color: var(--primary);
            border: 1px solid var(--rose-gold-Border);
            font-size: 1.1rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 12;
            box-shadow: 0 2px 8px rgba(0,0,0,0.18);
            transition: background 0.2s, transform 0.2s;
        }

        .slider-arrow:hover { background: var(--primary); color: #fff; transform: translateY(-50%) scale(1.08); }
        .slider-arrow.prev { right: 8px; }
        .slider-arrow.next { left: 8px; }

        .slider-dots {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 5px;
            z-index: 11;
            background: rgba(42, 24, 36, 0.45);
            padding: 4px 8px;
            border-radius: 12px;
            backdrop-filter: blur(3px);
        }

        .slider-dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255, 255, 255, 0.55); cursor: pointer; transition: all 0.2s; }
        .slider-dot.active { background: #fff; width: 16px; border-radius: 6px; }

        .btn-fav-card {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.92);
            border: 1.5px solid var(--rose-gold-Border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            cursor: pointer;
            z-index: 14;
            box-shadow: 0 3px 10px rgba(0,0,0,0.12);
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .btn-fav-card:hover { transform: scale(1.12); }
        .btn-fav-card.active { background: #fff0f5; border-color: var(--heart-red); animation: heartPop 0.35s ease; }

        @keyframes heartPop { 0% { transform: scale(1); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }

        .eye-overlay-tag {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(42, 24, 36, 0.75);
            color: #fff;
            font-size: 0.7rem;
            padding: 3px 9px;
            border-radius: 10px;
            backdrop-filter: blur(4px);
            z-index: 10;
        }

        .ai-color-tag {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.92);
            color: var(--primary);
            font-size: 0.7rem;
            font-weight: 800;
            padding: 4px 9px;
            border-radius: 10px;
            border: 1px solid var(--rose-gold-Border);
            z-index: 10;
        }

        .sold-out-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(42, 24, 36, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 13;
        }

        .sold-out-overlay span { background: var(--danger); color: #fff; padding: 8px 20px; border-radius: 25px; font-weight: 800; font-size: 0.95rem; }

        .card-body { padding: 16px; display: flex; flex-direction: column; gap: 11px; flex-grow: 1; }
        .price-row { display: flex; justify-content: space-between; align-items: center; }
        .price-tag { font-size: 1.35rem; font-weight: 900; color: var(--primary-dark); }
        .price-currency { font-size: 0.85rem; color: var(--rose-gold); font-weight: 800; margin-right: 3px; }

        .low-stock-alert {
            background: #fff0f2;
            color: #c62828;
            border: 1px solid #ffcdd2;
            padding: 5px 10px;
            border-radius: 10px;
            font-size: 0.78rem;
            font-weight: 800;
            animation: pulseUrgency 1.6s infinite;
        }

        @keyframes pulseUrgency { 0% { transform: scale(1); } 50% { transform: scale(1.03); background: #ffe4e8; } 100% { transform: scale(1); } }
        .in-stock-normal { font-size: 0.8rem; color: var(--success); font-weight: 800; }

        .options-box { background: var(--light-pink); padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 8px; }
        .option-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 0.82rem; font-weight: 700; }
        .option-row select { flex: 1; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--rose-gold-Border); background: #fff; font-weight: 700; color: var(--text-main); }

        .card-actions-row { margin-top: auto; display: flex; gap: 8px; }
        .btn-add-cart {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.92rem;
            font-weight: 800;
            cursor: pointer;
            flex: 1;
            transition: opacity 0.2s;
        }

        .btn-add-cart:hover { opacity: 0.94; }
        .btn-add-cart:disabled { background: #bdbdbd; color: #f5f5f5; cursor: not-allowed; }

        .reviews-section { max-width: 1120px; margin: 35px auto 20px; padding: 0 15px; }
        .reviews-header { text-align: center; margin-bottom: 18px; }
        .reviews-header h3 { color: var(--primary); font-size: 1.25rem; font-weight: 900; }
        .reviews-header p { color: var(--text-muted); font-size: 0.85rem; }

        .reviews-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 15px; }
        .empty-reviews-box { grid-column: 1 / -1; background: #fff; border: 1.5px dashed var(--rose-gold-Border); border-radius: 16px; padding: 24px; text-align: center; color: var(--text-muted); font-size: 0.88rem; font-weight: 700; }

        .review-card { background: #fff; border: 1px solid var(--border-color); border-radius: 16px; padding: 14px 16px; box-shadow: 0 4px 12px rgba(94, 35, 77, 0.04); }
        .review-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .reviewer-badge { font-weight: 800; font-size: 0.82rem; color: var(--primary); background: var(--soft-blush); padding: 3px 10px; border-radius: 12px; }
        .review-stars { color: #f59e0b; font-size: 0.9rem; }
        .review-text { font-size: 0.84rem; color: var(--text-main); line-height: 1.5; margin-top: 6px; }

        .ai-chat-float { position: fixed; bottom: 20px; left: 20px; z-index: 600; }
        .ai-chat-btn {
            background: linear-gradient(135deg, var(--primary) 0%, #9b3d7e 100%);
            color: #fff;
            border: 2px solid var(--rose-gold-Border);
            padding: 12px 18px;
            border-radius: 30px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(94, 35, 77, 0.38);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.88rem;
        }

        .ai-modal {
            position: fixed;
            bottom: 80px;
            left: 20px;
            width: 365px;
            max-width: calc(100vw - 40px);
            background: #fff;
            border: 2px solid var(--rose-gold);
            border-radius: 20px;
            box-shadow: 0 12px 35px rgba(42, 24, 36, 0.22);
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 650;
        }

        .ai-modal.active { display: flex; }

        .ai-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: #fff;
            padding: 13px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 800;
            font-size: 0.9rem;
        }

        .ai-body { padding: 12px; height: 320px; overflow-y: auto; background: var(--light-pink); display: flex; flex-direction: column; gap: 10px; font-size: 0.84rem; scroll-behavior: smooth; }
        .ai-msg { padding: 10px 13px; border-radius: 14px; max-width: 90%; line-height: 1.55; }
        .ai-msg.bot { background: #fff; border: 1px solid var(--border-color); align-self: flex-start; color: var(--text-main); }
        .ai-msg.user { background: var(--primary); color: #fff; align-self: flex-end; }
        .ai-typing { font-size: 0.78rem; color: var(--primary); font-weight: 700; background: var(--soft-blush); padding: 7px 12px; border-radius: 12px; align-self: flex-start; display: inline-block; }

        .ai-chat-gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 6px; margin-top: 8px; }
        .ai-chat-img { width: 100%; height: 135px; object-fit: cover; border-radius: 10px; border: 1.5px solid var(--rose-gold-Border); cursor: zoom-in; display: block; }

        .ai-quick-chips { display: flex; gap: 6px; padding: 8px 10px; background: #fff; border-top: 1px solid var(--border-color); overflow-x: auto; scrollbar-width: none; }
        .ai-quick-chips::-webkit-scrollbar { display: none; }
        .ai-chip { background: var(--soft-blush); color: var(--primary); border: 1px solid var(--rose-gold-Border); padding: 5px 10px; border-radius: 15px; font-size: 0.74rem; font-weight: 700; cursor: pointer; white-space: nowrap; }

        .ai-footer { padding: 10px; border-top: 1px solid var(--border-color); display: flex; gap: 6px; background: #fff; }
        .ai-footer input { flex: 1; padding: 9px 12px; border: 1px solid var(--rose-gold-Border); border-radius: 10px; font-size: 0.84rem; }
        .ai-footer button { background: var(--primary); color: #fff; border: none; padding: 0 15px; border-radius: 10px; font-weight: 800; cursor: pointer; }

        .ai-action-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
        .ai-suggest-btn { background: var(--primary); color: #fff; border: none; padding: 6px 11px; border-radius: 8px; font-size: 0.75rem; font-weight: 700; cursor: pointer; }
        .ai-suggest-btn.secondary { background: var(--soft-blush); color: var(--primary); border: 1px solid var(--rose-gold-Border); }

        .modal-backdrop {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(42, 24, 36, 0.72);
            backdrop-filter: blur(3px);
            display: none;
            justify-content: center;
            align-items:
